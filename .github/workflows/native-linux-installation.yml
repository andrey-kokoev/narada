name: Native Linux installation evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux:
    name: Native Linux installation and first-use evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NARADA_REQUIRE_NATIVE_LINUX_E2E: "1"
    steps:
      - name: Check out Narada
        uses: actions/checkout@v4

      # Narada's development workspace intentionally spans these sibling repositories.
      - name: Check out sibling workspace repositories
        shell: bash
        run: |
          set -euo pipefail
          declare -A sibling_shas=(
            [narada-core]=0f3bf74713a9daf409a8e03b32481e83b763d9d1
            [mcp-surfaces]=c46f8644b3d4317d17155f24282b19d34807bc67
            [agent-cli]=4a2f33863e1786b39b378ce64f17b983f6e96904
            [agent-tui]=dc74b46676c6809b975dd6b93c22ba2f72466a4d
          )
          for repo in narada-core mcp-surfaces agent-cli agent-tui; do
            git clone --depth 1 "https://github.com/andrey-kokoev/${repo}.git" "../${repo}"
            git -C "../${repo}" fetch --depth 1 origin "${sibling_shas[$repo]}"
            git -C "../${repo}" checkout --detach "${sibling_shas[$repo]}"
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Capture native host identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/narada-linux-evidence"
          echo "NARADA_LINUX_INSTALLATION_EVIDENCE_DIR=$RUNNER_TEMP/narada-linux-evidence" >> "$GITHUB_ENV"
          {
            date -Is
            uname -a
            cat /etc/os-release
            id
            node --version
            pnpm --version
            for repo in . ../narada-core ../mcp-surfaces ../agent-cli ../agent-tui; do
              printf '\nrepository=%s\n' "$repo"
              git -C "$repo" rev-parse HEAD
            done
          } | tee "$RUNNER_TEMP/narada-linux-evidence/host-and-source.txt"

      - name: Install the clean workspace
        run: pnpm install --no-frozen-lockfile

      - name: Install the browser runtime
        run: pnpm --filter @narada2/cli exec playwright install chromium

      - name: Run the native Linux installation E2E gate
        run: pnpm --filter @narada2/cli run test:linux-installation-e2e

      - name: Capture post-run evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/narada-linux-evidence"
          {
            printf '%s\n' 'processes:'
            ps -eo pid,ppid,user,stat,cmd --forest
            printf '%s\n' 'user-site roots:'
            find "${XDG_DATA_HOME:-$HOME/.local/share}/narada" -maxdepth 4 -printf '%M %u:%g %p\n' 2>/dev/null || true
            printf '%s\n' 'systemd user state:'
            systemctl --user is-system-running 2>&1 || true
          } > "$RUNNER_TEMP/narada-linux-evidence/post-run.txt"

      - name: Upload native Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-installation-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/narada-linux-evidence
          if-no-files-found: error
          retention-days: 14
