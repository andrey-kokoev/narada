name = "narada-nars-projection-synthetic"
main = "dist/worker.js"
compatibility_date = "2026-06-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# This deployment is deliberately infrastructure-only. It has no D1 or AI
# bindings, so the synthetic authority smoke proves the unavailable-provider
# boundary instead of accidentally exercising the production executor.
[vars]
NARS_AUTHORITY_REQUIRE_CREDENTIAL = "true"
NARS_OUTBOUND_PROVIDER_ENABLED = "false"

[[durable_objects.bindings]]
name = "NARS_PROJECTION_STATE"
class_name = "NarsProjectionState"

[[durable_objects.bindings]]
name = "NARS_WORKSPACE_DIRECTORY"
class_name = "NarsWorkspaceDirectory"

[[durable_objects.bindings]]
name = "HOST_FLEET_AUDIT"
class_name = "CloudflareHostFleetAuditState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NarsProjectionState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NarsWorkspaceDirectory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CloudflareHostFleetAuditState"]

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*"]
