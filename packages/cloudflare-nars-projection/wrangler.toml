name = "narada-nars-projection"
main = "dist/worker.js"
compatibility_date = "2026-06-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Authority sessions are bearer-bound to the browser credential used to
# create them. Local unit fixtures may explicitly disable this requirement.
NARS_AUTHORITY_REQUIRE_CREDENTIAL = "true"
# HTTPS provider adapters require an explicit deployment capability. Workers
# AI is the default provider route for this worker.
NARS_OUTBOUND_PROVIDER_ENABLED = "false"
# The remote Operator Console mirror is enabled only after Cloudflare Access
# admission and the gateway bridge secret are configured. Access issuer and
# audience are non-secret deployment variables; the gateway token remains a
# Wrangler secret and is never projected to the browser.
# OPERATOR_CONSOLE_ACCESS_REQUIRED = "true"
# OPERATOR_CONSOLE_ACCESS_TEAM_DOMAIN = "https://team.cloudflareaccess.com"
# OPERATOR_CONSOLE_ACCESS_AUDIENCE = "application-audience"
# OPERATOR_CONSOLE_GATEWAY_URL = "https://console-gateway.example.test"
# OPERATOR_CONSOLE_GATEWAY_ORIGIN_PIN = "https://console-gateway.example.test"
# The gateway is reached through a private Workers VPC service. The URL is an
# internal HTTP authority name used for the Host header; it is not public DNS.
OPERATOR_CONSOLE_GATEWAY_TRANSPORT = "vpc-service"
OPERATOR_CONSOLE_GATEWAY_URL = "http://operator-console.internal"
OPERATOR_CONSOLE_GATEWAY_ORIGIN_PIN = "http://operator-console.internal"
OPERATOR_CONSOLE_GATEWAY_TCP_HOST = "127.0.0.1"
OPERATOR_CONSOLE_GATEWAY_TCP_PORT = "61730"
[ai]
binding = "AI"

[[d1_databases]]
binding = "INTELLIGENCE_REGISTRY_DB"
database_name = "narada-cloudflare-site-registry"
database_id = "170ca715-9c9e-4c48-896f-0e8daba72217"

[[durable_objects.bindings]]
name = "NARS_PROJECTION_STATE"
class_name = "NarsProjectionState"

[[durable_objects.bindings]]
name = "NARS_WORKSPACE_DIRECTORY"
class_name = "NarsWorkspaceDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NarsProjectionState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NarsWorkspaceDirectory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CloudflareHostFleetAuditState"]

[[migrations]]
tag = "v4"
deleted_classes = ["CloudflareHostFleetAuditState"]

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*"]

[[vpc_services]]
binding = "OPERATOR_CONSOLE_GATEWAY"
service_id = "019fb864-48c5-7433-993c-380abb1037b0"
remote = true

# HTTP VPC services do not provide a reliable long-lived WebSocket response to
# the Worker fetch API. The same tunnel is also bound as a VPC Network so the
# Worker can use the documented raw-TCP connect API for the WebSocket leg.
[[vpc_networks]]
binding = "OPERATOR_CONSOLE_GATEWAY_NETWORK"
tunnel_id = "b850c3df-10c3-4c3d-adf8-0d000c680794"
remote = true

# The Worker supplies only infrastructure bindings. Catalog selection,
# credential locators, plan validation, and invocation evidence remain owned
# by the shared D1-backed invokable-intelligence gateway. NARS owns its own
# Durable Object session and event journal.
